name: Sakai connector
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml
      - run: mvn -B verify
      - name: Checksum the installable WAR
        working-directory: target
        run: sha256sum guardlms.war > guardlms.war.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: guardlms-sakai-war
          path: |
            target/guardlms.war
            target/guardlms.war.sha256
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish installable WAR
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: guardlms-sakai-war
      - name: Verify downloaded WAR
        run: sha256sum --check guardlms.war.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}"
          # A rerun keeps an already published release intact. An interrupted
          # draft can resume uploading before it becomes visible to installers.
          if gh release view "$tag" --json isDraft --jq '.isDraft' > release-state.txt; then
            if [[ "$(cat release-state.txt)" == "false" ]]; then
              echo "Release $tag is already published."
              exit 0
            fi
          else
            printf 'Download guardlms.war and deploy it to Tomcat 9 on Sakai 25.2 (Java 17).\n\nCommit: %s\nBuild and tests: %s/%s/actions/runs/%s\n\nVerify with: sha256sum --check guardlms.war.sha256\n' \
              "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release-notes.txt
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "Sakai connector build ${GITHUB_RUN_NUMBER}" \
              --notes-file release-notes.txt
          fi
          gh release upload "$tag" guardlms.war guardlms.war.sha256 --clobber
          gh release edit "$tag" --draft=false --latest
